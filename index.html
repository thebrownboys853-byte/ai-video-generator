<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Video Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 92%;
      max-width: 600px;
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      resize: none;
      font-size: 16px;
      outline: none;
    }

    select {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6366f1;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4f46e5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .video-box {
      margin-top: 20px;
      display: none;
    }

    video {
      width: 100%;
      border-radius: 12px;
      background: #000;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 AI Video Generator</h1>

    <div class="subtitle">
      Create amazing videos from your ideas
    </div>

    <textarea
      id="prompt"
      placeholder="Write your video prompt here...&#10;&#10;Example: A young boy running through a beautiful forest at sunset, cinematic lighting, realistic style"
    ></textarea>

    <select id="ratio">
      <option value="16:9">Landscape — 16:9</option>
      <option value="9:16">Portrait — 9:16</option>
      <option value="1:1">Square — 1:1</option>
    </select>

    <button id="generateButton" onclick="generateVideo()">
      🚀 Generate Video
    </button>

    <div id="status"></div>

    <div class="video-box" id="videoBox">
      <video id="videoPlayer" controls></video>
    </div>

  </div>

  <script>

    async function generateVideo() {

      const prompt = document.getElementById("prompt").value.trim();
      const ratio = document.getElementById("ratio").value;
      const status = document.getElementById("status");
      const button = document.getElementById("generateButton");
      const videoBox = document.getElementById("videoBox");
      const video = document.getElementById("videoPlayer");

      if (!prompt) {
        status.innerText = "⚠️ Please enter a video prompt.";
        return;
      }

      button.disabled = true;
      videoBox.style.display = "none";
      video.removeAttribute("src");

      status.innerText = "⏳ Starting video generation...";

      try {

        // Step 1: Send prompt to Cloudflare Worker
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: prompt,
            ratio: ratio
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message || "Generation request failed"
          );
        }

        const requestId = data.request_id;

        if (!requestId) {
          throw new Error("No request ID received from server");
        }

        status.innerText =
          "🎬 Video generation started... Please wait.";

        // Step 2: Check generation status
        let completed = false;

        while (!completed) {

          await new Promise(resolve =>
            setTimeout(resolve, 5000)
          );

          const statusResponse = await fetch(
            `/api/status?id=${encodeURIComponent(requestId)}`
          );

          const statusData = await statusResponse.json();

          if (!statusResponse.ok) {
            throw new Error(
              statusData.message || "Could not check video status"
            );
          }

          if (statusData.status === "COMPLETED") {

            completed = true;

            status.innerText =
              "✅ Video generation completed!";

          } else if (statusData.status === "FAILED") {

            throw new Error(
              "Video generation failed"
            );

          } else if (statusData.status === "IN_PROGRESS") {

            status.innerText =
              "🎬 Generating your video...";

          } else {

            status.innerText =
              "⏳ Video is in queue...";

          }
        }

        // Step 3: Get completed video
        status.innerText =
          "📥 Loading your video...";

        const resultResponse = await fetch(
          `/api/result?id=${encodeURIComponent(requestId)}`
        );

        const resultData = await resultResponse.json();

        if (!resultResponse.ok) {
          throw new Error(
            resultData.message || "Could not get video result"
          );
        }

        const videoUrl =
          resultData.video?.url;

        if (!videoUrl) {
          throw new Error(
            "Video URL was not returned"
          );
        }

        // Step 4: Show video
        video.src = videoUrl;
        videoBox.style.display = "block";
        video.load();

        status.innerText =
          "🎉 Video generated successfully!";

      } catch (error) {

        console.error("Video generation error:", error);

        status.innerText =
          "❌ " + (error.message || "Something went wrong");

      } finally {

        button.disabled = false;

      }
    }

  </script>

</body>
</html>
